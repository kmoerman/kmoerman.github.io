<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }
  body {
    display: grid;
    place-items: center;
  }
  a {
    display: grid;
    place-items: center;
    width: min(100vw, 36rem);
    height: min(100dvh, 36rem);
  }

  img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  <a href="https://github.com/kmoerman">
    <img src="assets/img/logo-v2.svg" alt="kmoerman.github.io" />
  </a>
</body>
</html>
