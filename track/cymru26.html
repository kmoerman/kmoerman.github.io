<!DOCTYPE html>
<html>
<head>
  <title>🏴󠁧󠁢󠁷󠁬󠁳󠁿 Cymru 2026</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/essential-audio-player@2.1.0/essential_audio.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --button-protrusion: 0;
    }
    
    h3 {
      margin-bottom: 0.2em;
    }
    
    .essential-audio {

    }

    .leaflet-tile-pane .leaflet-layer + .leaflet-layer {
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol/dist/L.Control.Locate.min.js" charset="utf-8"></script>
  <script src="https://cdn.jsdelivr.net/npm/essential-audio-player@2.1.0/essential_audio.min.js"></script>
  <script src="track.js"></script>

  <script>
  const T = track.from (L
    , { goto: 1
      , skip: 1
      , jump: 1
      }
    , { peak: 5
      , mark: 4
      , [track.default]: 3
      , part: 2
      , none: 1
      }
    , { legacy: (t, ...xs) => xs.reduce((t, x) => t.goto(...x), t) }
    )
   .show(
    'map',
    [[52.5, -4], 8],
    [ {url: 'https://tiles-eu.stadiamaps.com/tiles/outdoors/{z}/{x}/{y}{r}.png'
      , detectRetina: false
      , maxZoom: 20
      , attribution: false
      , opacity: 1
      },
      { url: 'https://tiles-eu.stadiamaps.com/tiles/stamen_terrain_background/{z}/{x}/{y}{r}.png'
      , detectRetina: false
      , maxZoom: 20
      , attribution: `
  &copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a>
  &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a>
  &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>`
      , opacity: 0.4
      }

    ]
   )
   .add
    ( L.control.scale({metric: true, imperial: false})
    //, L.control.locate()
    )
   .select(window.location.search.slice(1).split('&').filter(x => x))

  function flickr (embed) {
    const img = (/<img src="([^"]+)/.exec(embed || '') || [])[1];
    const lnk = (/href="([^"]+)/.exec(embed || '') || [])[1];

    if (!lnk || !img)
      return embed;

    return `<a class="flickr" href="${lnk}"><img src="${img}" /></a>`;
  }

  function audio (url, {loop=false}) {
    return `<div class="essential_audio" style="margin: 1.5em 0; width: 0;" data-url="${url}" ${loop ? 'data-loop' : ''}></div>`
  }

  function text (s) {
    if (!s) return 0

    else return `<p style="max-width: 12em">${s}</p>`
  }

  function go (T, track) {
    console.log(track)
    return track.reduce((T, t) => T[t], T)
  }

  // flickr('<a data-flickr-embed="true" href="https://www.flickr.com/photos/198383566@N06/53771857296" title="Untitled"><img src="https://live.staticflickr.com/65535/53771857296_e387eb7638_k.jpg" width="2048" height="1662" alt="Untitled"/></a>')
  T.goto.mark(53.25707065004433, -3.9830712095862335, "zo 23/8", "Llanfairfechan <br/>"+audio("Llanfair.mp3",{loop:false}) , flickr('<a data-flickr-embed="true" href="https://www.flickr.com/photos/198383566@N06/55484634045/in/photostream/lightbox/" title="Untitled"><img src="https://live.staticflickr.com/65535/55484634045_b792948d2e_c.jpg" width="800" height="800" alt="Untitled"/></a>'))
   .goto.part(53.20760, -3.93569)
   .goto(53.15472, -3.97322, 'ma 24/8', flickr('<a data-flickr-embed="true" href="https://www.flickr.com/photos/198383566@N06/55485760441" title="Untitled"><img src="https://live.staticflickr.com/65535/55485760441_fa0d059d48_c.jpg" width="800" height="800" alt="Untitled"/></a>'))
   .goto.part(53.17951, -4.06098)
   .skip.part(53.10204, -3.91834)
   .skip.part(53.0807212, -4.0208539)
   .goto(53.06960, -4.03991, 'di 25/8')
   .goto.mark(53.06846, -4.07614, '⛰️ Yr Wyddfa / Snowdon')
   .goto.part(53.07384, -4.14470)
   .skip.part(53.01153, -4.10345)
   .skip.part(52.93087, -4.13419)
   .skip(52.40705, -4.07812, 'wo 26/8')
   .skip.part(51.88370, -3.99578)
   .goto(51.84569, -3.92384, 'do 27/8', 'Brecon Beacons Way', flickr('<a data-flickr-embed="true" href="https://www.flickr.com/photos/198383566@N06/55492175674" title="Untitled"><img src="https://live.staticflickr.com/65535/55492175674_2320821486_c.jpg" width="800" height="800" alt="Untitled"/></a>'))
   .goto(51.87566, -3.77220, 'vr 28/8')
   .goto.part(51.83577, -3.67587)
   .skip(51.75203, -3.37394, 'za 29/8')
   .branch(T => T.goto(51.75705, -3.39031, 'zo 30/8', 'Rustdag'))
   .branch(T => T.skip.part(51.84117, -3.38091)
                  .goto.peak(51.88396, -3.43682, 'ma 31/8', '⛰️ Pen Y Fan')
                  .goto.part(51.87208, -3.47947))
   .raw(map => {
      const ea = Essential_Audio
      map.on('popupopen' , ea.init)
      map.on('popupclose', ea.Stop)
    })

  </script>
</body>
</html>
